# 1. \u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u0627\u062A\u0635\u0627\u0644 (\u062A\u0645 \u0625\u062E\u0641\u0627\u0621 \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u062D\u0633\u0627\u0633\u0629 \u0644\u0644\u0631\u0628\u0637 \u0645\u0639 Render)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. \u0625\u0639\u062F\u0627\u062F\u0627\u062A Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# 3. \u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u0627\u0633\u062A\u0642\u0631\u0627\u0631 \u0648\u0627\u0644\u0640 Batching
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# 4. \u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\u0633\u062C\u0644 (Logging) \u0644\u0645\u0646\u0639 \u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0627\u0644\u062D\u0645\u0631\u0627\u0621 \u0627\u0644\u0632\u0627\u0626\u062F\u0629
# \u0647\u0630\u0627 \u0627\u0644\u0633\u0637\u0631 \u0633\u064A\u062C\u0639\u0644 \u0627\u0644\u0640 Console \u064A\u0639\u0631\u0636 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0627\u0644\u0647\u0627\u0645\u0629 \u0641\u0642\u0637
logging.level.root=info
# \u0625\u064A\u0642\u0627\u0641 \u062A\u0642\u0631\u064A\u0631 \u0627\u0644\u062A\u0634\u062E\u064A\u0635 \u0627\u0644\u0645\u0641\u0635\u0644 (\u0627\u0644\u0630\u064A \u0638\u0647\u0631 \u0641\u064A \u0627\u0644\u0635\u0648\u0631\u0629 \u0627\u0644\u0633\u0627\u0628\u0642\u0629)
debug=false
spring.main.banner-mode=off