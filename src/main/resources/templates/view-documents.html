<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>منظومة معاينة المستندات المتكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root { 
            --primary: #3b82f6; 
            --danger: #ef4444; 
            --dark: #0f172a; 
            --glass: rgba(255, 255, 255, 0.1);
            --gold: #d4af37;
            --success: #10b981;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--dark); 
            color: white; 
            margin: 0; 
            padding: 20px; 
            overflow-x: hidden; 
        }

        /* تنسيق الهيدر الرئيسي */
        .title-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 40px; 
            background: var(--glass); 
            padding: 20px 30px; 
            border-radius: 15px; 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 15px 35px rgb(255, 255, 255);
        }

        /* حاوي الكروت الأربعة */
        .info-wrapper { 
            display: flex; 
            gap: 20px; 
            align-items: stretch; 
            flex: 1;
        }

        /* تنسيق المربع (الكارت) الموحد */
     .info-box {
    background-color: rgb(0, 64, 128); /* 🎨 غير هذا اللون لتغيير خلفية الكارات بالكامل */
    border: 1px solid rgba(255, 255, 255, 0.05); /* لون حدود الكارات */
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    color: #ffffff;
}

        .info-box h2 { 
            margin: 0 0 8px 0; 
            font-size: 0.9rem; 
            color: #94a3b8; 
            font-weight: bold;
        }

        .info-box > span { 
            color: white; 
            font-weight: bold; 
            font-size: 1.2rem; 
        }

        .status-approved-text { color: #10b981 !important; }
        .status-pending-text { color: #facc15 !important; }

        /* الختم */
        .stamp {
            border: 4px double var(--success);
            color: var(--success);
            padding: 5px 20px;
            border-radius: 10px;
            transform: rotate(-10deg); 
            opacity: 0.9;
            display: none; 
            text-align: center;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            line-height: 1.2;
        }
        .stamp .stamp-text { font-size: 1.4rem; font-weight: bold; display: block; margin-bottom: 2px; }
        .stamp .stamp-date { font-size: 0.9rem; font-weight: normal; display: block; border-top: 1px solid var(--success); padding-top: 2px; }
        .status-approved .stamp { display: block; }

        /* السلايدر */
        .slider-wrapper { position: relative; max-width: 1200px; margin: auto; padding: 0 50px; }
        .images-container { 
            background: #ffffff; padding: 25px; border-radius: 24px; display: flex; 
            overflow-x: auto; gap: 20px; scroll-behavior: smooth; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            align-items: flex-start;
        }
        .images-container::-webkit-scrollbar { height: 8px; }
        .images-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .img-card { display: inline-flex; flex-direction: column; align-items: center; flex: 0 0 auto; width: 200px; }
        .img-card img { 
            width: 100%; height: 260px; 
            object-fit: contain; 
            background: #f1f5f9;
            border-radius: 15px; 
            cursor: pointer; transition: 0.4s; border: 1px solid #e2e8f0; 
        }
        .img-card img:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-card p { margin-top: 15px; font-size: 13px; color: #1e293b; font-weight: 700; text-align: center; background: #f1f5f9; padding: 5px 12px; border-radius: 8px; width: 85%; }

        .nav-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); width: 45px; height: 45px; 
            background: white; border-radius: 50%; border: none; cursor: pointer; z-index: 10; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-size: 20px; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: var(--primary); color: white; }
        .left-btn { left: -10px; } .right-btn { right: -10px; }

        /* المودال والتحكم */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }

        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 40px;
            font-weight: bold;
            padding: 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
            user-select: none;
            z-index: 2100;
        }

        .modal-nav:hover { background: rgba(255, 255, 255, 0.3); color: #2563eb; }
        .modal-prev { right: 30px; }
        .modal-next { left: 30px; }
        .modal-content { max-width: 80%; max-height: 80vh; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: transform 0.3s ease; }

        .zoom-controls { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 20px; background: rgba(255, 255, 255, 0.1); 
            padding: 12px 30px; border-radius: 100px; backdrop-filter: blur(15px); 
            z-index: 10001; border: 1px solid rgba(255,255,255,0.2);
        }
        .zoom-controls button { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; font-size: 20px; background: white; display: flex; align-items: center; justify-content: center; }

        .action-container { text-align: center; margin-top: 50px; }
        .btn { padding: 15px 35px; border-radius: 12px; cursor: pointer; font-weight: 700; text-decoration: none; border: none; font-size: 16px; transition: 0.3s; display: inline-flex; align-items: center; gap: 10px; }
        .btn-print { background: var(--primary); color: white; margin-left: 15px; }
        
        .back-fab {
            position: fixed; bottom: 30px; left: 30px; background: #f8fafc; color: #0f172a;
            width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 1000; border: none; cursor: pointer;
        }
        .back-fab:hover { transform: scale(1.1) rotate(-10deg); background: var(--primary); color: white; }

        .btn-back { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-back:hover { background: #e2e8f0; color: #0f172a; }

        @media print {
            .nav-btn, .action-container, .zoom-controls, .close-btn, .modal-nav, .back-fab, .view-switcher { display: none !important; }
            body { background: white; color: black; }
            .title-container { border: 2px solid #000; background: none !important; padding: 10px 20px; }
            .images-container { display: block !important; background: none !important; box-shadow: none !important; }
            .img-card { page-break-inside: avoid; margin-bottom: 20px; width: 100%; }
            .img-card img { height: auto !important; width: 100% !important; object-fit: contain !important; }
        }
   
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 45px;
            font-weight: bold;
            cursor: pointer;
            z-index: 3000;
            transition: 0.3s;
        }
        .close-btn:hover { color: #ef4444; transform: scale(1.2); }

        .view-switcher { text-align: center; margin-bottom: 20px; }
        .view-btn {
            background: var(--glass); border: 1px solid var(--primary); color: white;
            padding: 8px 20px; cursor: pointer; border-radius: 20px; font-family: 'Cairo'; transition: 0.3s; margin: 0 5px;
        }
        .view-btn.active { background: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }

        /* نمط القائمة العمودية */
        .images-container.list-mode { display: flex; flex-direction: column; gap: 30px; background: transparent; padding: 20px; overflow-x: hidden; }
        .list-mode .img-card { width: 100%; max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .list-mode .img-card img { width: 100%; height: auto; max-height: none; object-fit: contain; border-radius: 10px; }
        .list-mode .img-card p { width: 100%; font-size: 1.2rem; padding: 15px; margin-top: 10px; background: #f8fafc; color: var(--dark); border-right: 5px solid var(--primary); }
        .list-mode-active .nav-btn { display: none !important; }
    </style>


<style>
/* جدول التقرير الرسمي - مخفي تماماً في الشاشة العادية */

    display: none;
}

/* 🖨️ ستايل التحكم بالطباعة الفعلي */

        width: 30%;
    }
    
    /* ترويسة التقرير العلوي */

        text-align: center;
        border-bottom: 2px double #000;
        padding-bottom: 15px;
        margin-bottom: 25px;
    }
    .report-header h1 {
        font-size: 22px;
        margin: 0 0 5px 0;
    }
    .report-header p {
        font-size: 14px;
        margin: 5px 0;
    }
    
    /* تذييل الورقة للتوقيع والختم */
    .report-footer {
        margin-top: 50px;
        display: flex;
        justify-content: space-between;
        padding: 0 30px;
    }
    .signature-box {
        text-align: center;
        font-size: 14px;
        font-weight: bold;
    }
}
</style>

<style>
/* 🖨️ ستايل خاص لتعديل الصفحة بالكامل عند الضغط على زر طباعة الملف */
@media print {
    /* 1. إخفاء الأزرار وأشرطة التنقل الفركشة اللي ما نبيش نطبخوها */

        display: none !important;
    }

    /* 2. إلغاء نظام السلايدر العرضي وتحويله إلى شبكة عمودية تفرد الصور كلها */

        display: block !important;
        width: 100% !important;
        box-shadow: none !important;
        background: none !important;
        padding: 0 !important;
    }

    .images-container {
        display: block !important; /* فك الـ flex العرضي */
        overflow: visible !important; /* إظهار الصور الممتدة */
        width: 100% !important;
        height: auto !important;
    }

    /* 3. تنسيق كروت الصور لكي تنزل تحت بعضها بشكل مرتب وكل صورة في حجم مناسب */

        display: block !important;
        page-break-inside: avoid; /* منع انقسام الصورة الواحدة بين صفحتين */
        margin-bottom: 30px !important;
        text-align: center !important;
        width: 100% !important;
    }

    .img-card img {
        max-width: 90% !important; /* حجم الصورة لكي يتناسب مع ورقة A4 */
        height: auto !important;
        border: 1px solid #ddd !important;
        box-shadow: none !important;
        display: block !important;
        margin: 0 auto 10px auto !important;
        
        /* 💡 أهم سطر لضمان إجبار المتصفح على إظهار الصور */
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    .img-card p {
        color: #000 !important;
        font-weight: bold !important;
        font-size: 14px !important;
        margin-top: 5px !important;
    }

    /* 4. تنسيق كروت البيانات العلوية لكي تظهر واضحة باللون الأسود في الطباعة */
    .title-container {
        box-shadow: none !important;
        background: none !important;
        border-bottom: 2px solid #000 !important;
        padding-bottom: 20px !important;
    }
    
    .info-box {
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
    
    .info-box h2, .info-box span, .info-box p {
        color: #000 !important;
    }
}
</style>

        <img id="modalImg" class="modal-content">
        <button class="modal-nav modal-next" onclick="changeImage(1)">❯</button>

        <div class="zoom-controls">
            <button onclick="zoomIn()">+</button>
            <button onclick="zoomOut()">−</button>
            <button onclick="rotateRight()">⟳</button>
            <button onclick="resetZoom()">🔄</button>
            <button onclick="printCurrentImage()">🖨️</button>
        </div>
    </div>

    <script>
        function smartBack() {
            if (document.referrer !== "" && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = '/shipments'; 
            }
        }

        let scale = 1, rotate = 0, currentIdx = 0;
        let isDragging = false, startX, startY, translateX = 0, translateY = 0;
        let allImages = [];

        window.onload = () => {
            allImages = Array.from(document.querySelectorAll('#slider img')).map(img => img.src);
        };

        const modalImg = document.getElementById("modalImg");
        const imgModal = document.getElementById("imgModal");

        function openModal(imgElement) {
            imgModal.style.display = "flex";
            currentIdx = allImages.indexOf(imgElement.src);
            updateView();
        }

        function closeModal() { imgModal.style.display = "none"; }
        function updateView() { modalImg.src = allImages[currentIdx]; resetZoom(); }
        function changeImage(step) { currentIdx = (currentIdx + step + allImages.length) % allImages.length; updateView(); }
        function apply() { modalImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotate}deg)`; }
        
        function zoomIn() { if (scale < 5) { scale += 0.3; apply(); } }
        function zoomOut() { if (scale > 0.3) { scale -= 0.3; apply(); } }
        function rotateRight() { rotate += 90; apply(); }
        function resetZoom() { scale = 1; rotate = 0; translateX = 0; translateY = 0; apply(); }

        function printCurrentImage() {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`<html><head><title>طباعة</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}img{max-width:100%;max-height:100%;object-fit:contain;}</style></head><body><img src="${modalImg.src}" onload="window.print();window.close();"></body></html>`);
            printWindow.document.close();
        }

        modalImg.onmousedown = (e) => { if(scale === 1) return; isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; };
        window.onmousemove = (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; apply(); };
        window.onmouseup = () => { isDragging = false; };
        imgModal.onwheel = (e) => { e.preventDefault(); e.deltaY < 0 ? zoomIn() : zoomOut(); };

        window.onkeydown = (e) => {
            if (imgModal.style.display === "flex") {
                if (e.key === "Escape") closeModal();
                if (e.key === "ArrowRight") changeImage(-1);
                if (e.key === "ArrowLeft") changeImage(1);
            }
        };

        function scrollSlider(amt) { document.getElementById('slider').scrollBy({ left: amt, behavior: 'smooth' }); }

 function toggleView() {
    const slider = document.getElementById('slider');
    const wrapper = document.getElementById('mainWrapper');
    const btnToggle = document.getElementById('btnToggleView');

    // تفقد هل الوضع الحالي يحتوي على الـ list-mode أم لا؟
    if (!slider.classList.contains('list-mode')) {
        // 1. تحويل إلى العرض العمودي
        slider.classList.add('list-mode');
        wrapper.classList.add('list-mode-active');
        btnToggle.classList.add('active');
        btnToggle.innerHTML = " تحويل إلى عرض  (عرضي)";
        
        // سحب الشاشة بسلاسة لبداية الصور
        window.scrollTo({ top: wrapper.offsetTop - 50, behavior: 'smooth' });
    } else {
        // 2. إرجاع إلى الوضع العرضي الأصلي (السلايدر) عند الضغط مرة ثانية
        slider.classList.remove('list-mode');
        wrapper.classList.remove('list-mode-active');
        btnToggle.classList.remove('active');
        btnToggle.innerHTML = "تحويل إلى العرض العمودي";
    }
}
    </script>

<script>
function fireDirectConfirm(id, actionType) {
    if (actionType === 'approve') {
        Swal.fire({
            title: 'اعتماد الشحنة؟',
            text: 'سيتم نقل الشحنة إلى قائمة المعتمدة فوراً ومزامنتها.',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#059669',
            confirmButtonText: 'نعم، اعتماد',
            cancelButtonText: 'إلغاء'
        }).then((result) => { 
            if (result.isConfirmed) {
                window.location.href = '/shipments/approve/' + id; 
            }
        });
    } else if (actionType === 'reject') {
        Swal.fire({
            title: 'تأكيد رفض الشحنة',
            input: 'textarea',
            inputPlaceholder: 'يرجى كتابة سبب الرفض هنا لحفظه في الأرشيف...',
            inputAttributes: { maxlength: 1000 },
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            confirmButtonText: 'حفظ الرفض',
            cancelButtonText: 'تراجع',
            preConfirm: (value) => {
                if (!value) {
                    Swal.showValidationMessage('عذراً، يجب إدخال سبب للرفض أولاً');
                }
                return value;
            }
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/shipments/reject/' + id;
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'reason';
                input.value = result.value;
                
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        });
    }
}
</script>
