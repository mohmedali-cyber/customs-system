<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">إدارة الشحنات - منظومة الأرشيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: rgb(48, 48, 48);
            --primary2: rgb(255, 255, 255);
            --primary3: rgb(0, 0, 0);

            --accent: rgb(0, 0, 0);
            --accent-glow: rgba(37, 99, 235, 0.15);
            --bg-body: rgb(255, 255, 255);
            --text-main: rgb(255, 169, 83);
            --text-muted: rgb(128, 255, 0);
            --text-muted2: rgb(255, 128, 0);
            --white: rgb(192, 192, 192);
            --success: #059669;
            --danger: #dc2626;
            --shadow-md: 0 10px 25px -5px rgb(255, 197, 138);
            --radius: 16px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(at 0% 0%, rgb(0, 0, 0) 0px, transparent 50%), 
                              radial-gradient(at 100% 100%, rgb(0, 0, 0) 0px, transparent 50%);
            margin: 0; padding: 40px; color: var(--text-main);
            min-height: 100vh;
        }

        .back-fab {
            position: fixed; bottom: 40px; left: 40px;
            background: var(--white); color: var(--primary);
            width: 60px; height: 60px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md); transition: 0.4s;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.8); cursor: pointer;
        }
        .back-fab:hover { transform: translateY(-5px); background: var(--primary); color: white; }

        .header-main { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; background: rgb(45, 45, 45);
            backdrop-filter: blur(10px); padding: 25px 40px;
            border-radius: var(--radius); box-shadow: var(--shadow-md);
            border: 1px solid rgb(255, 128, 0);
        }

        .header-info { display: flex; align-items: center; gap: 25px; }
        .portal-btn {
            background: var(--primary); color: rgb(255, 168, 81); text-decoration: none;
            padding: 12px 25px; border-radius: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.3s;
        }
        .portal-btn:hover { background: var(--accent); }

        .tabs-container { display: flex; gap: 12px; margin-bottom: -1px; padding: 0 20px; }
        .tab-link {
            padding: 14px 28px; background: rgb(75, 75, 75); 
            border-radius: 14px 14px 0 0; text-decoration: none; 
            color: var(--text-muted); font-weight: 700; transition: 0.3s;
        }
        .tab-link.active {
            background: var(--white); color: var(--accent);
            border-top: 4px solid var(--accent); position: relative; z-index: 2;
        }

        .workspace {
            background: var(--white); border-radius: var(--radius);
            padding: 40px; box-shadow: var(--shadow-md);
            border: 1px solid rgb(255, 128, 0); min-height: 500px;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 15px; }
        th { padding: 15px 20px; color: var(--text-muted); font-size: 0.9rem; text-align: center; }
        td { padding: 20px; text-align: center; background: rgb(255, 255, 255); border-top: 1px solid rgb(0, 0, 0); border-bottom: 1px solid rgb(0, 0, 0); }
        tr td:first-child { border-right: 1px solid rgb(221, 111, 0); border-radius: 0 18px 18px 0; }
        tr td:last-child { border-left: 1px solid rgb(210, 105, 0); border-radius: 18px 0 0 18px; }

        .stat-badge { background: linear-gradient(135deg, var(--primary), var(--accent)); color: rgb(255, 159, 64); padding: 6px 16px; border-radius: 8px; font-weight: 700; }

        /* زر عرض السبب الجديد */
        .btn-reason {
            background: rgb(40, 40, 40); color: var(--danger); border: 1px solid rgb(0, 0, 255);
            padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-weight: 700; transition: 0.3s; margin-top: 5px;
        }
        .btn-reason:hover { background: var(--danger); color: rgb(255, 128, 192); }

        .btn-mini { padding: 10px 20px; border-radius: 10px; border: none; font-family: 'Cairo'; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-view { background: var(--accent-glow); color: var(--accent); }
        .btn-approve { background: rgba(5, 150, 105, 0.1); color: var(--success); }
        .btn-reject { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .btn-delete { background: rgb(136, 0, 0); color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer; }

        .pagination-container { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #f8fafc; padding-top: 20px; }
        .pagination-list { display: flex; gap: 8px; list-style: none; }
        .page-item-link { text-decoration: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 10px; font-weight: 700; color: var(--primary); }
        .page-item-link.active { background: var(--primary); color: white; }
   
   
   
   
   
   
   
   
   
   
.luxury-logo-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    /* أزلنا الـ perspective لأنه غير ضروري لحركة الطفو ويقلل حمل الرندر */
}

.halo-logo-hero {
    width: 100%;
    height: 500px; /* الطول المعتمد */
    object-fit: cover;
    filter: brightness(0.7);
    border-radius: 0 0 20px 20px;
}

/* طبقة الشعار المتحرك - وضعية علوية مركّزة */
.floating-overlay {
    position: absolute; 
    top: 50%; /* الارتفاع المطلوب للأعلى */
    left: 50%;
    transform: translate(-50%, -50%); 
    z-index: 10;
}

.moving-logo-float {
    width: 200px; 
    height: auto;
    /* تم استبدال الرفرفة بالطفو الانسيابي */
    animation: soft-float 43s infinite ease-in-out;
    filter: drop-shadow(0 15px 25px rgb(255, 168, 81));
    will-change: transform; /* لتحسين الأداء ومنع الثقل */
}

/* أنميشن الطفو الانسيابي (أخف وأجمل) */
@keyframes soft-float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
        filter: drop-shadow(0 15px 25px rgb(0, 0, 0));
    }
    50% {
        /* حركة للأعلى بمقدار 20 بكسل مع ميلان بسيط جداً */
        transform: translateY(-20px) rotate(1deg);
        /* الظل يصبح أنعم عند الارتفاع */
        filter: drop-shadow(0 20px 40px rgb(255, 153, 51));
    }
}
    </style>


<style>

.header-main {

}

.header-info {

    flex-direction: column;
    align-items: center;

}

/* التعديل الجوهري للتاريخ */
.system-date {
    position: absolute; /* يخرجه من تدفق التوسط ووضعه في الجنب */
    right: 30px; /* يبعده عن حافة الصفحة اليمنى بمسافة 30px */

    text-align: right;
}

/* إذا أردت التاريخ في جهة اليسار بدلاً من اليمين، استبدل right بـ left: 30px */

.date-label {
    font-size: 0.85rem;
    color: var(--text-muted);
}

.date-value {
    font-size: 1rem;
    color: var(--primary2);
    font-weight: 700;
}
.portal-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    /* يمكنك إضافة الوانك الملكية هنا */
    background: linear-gradient(135deg, rgb(255, 143, 32) 0%, rgb(31, 31, 31) 100%);
    color: white;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.3s ease;
}

.portal-btn:hover {
    transform: translateY(-3px); /* رفعة بسيطة عند التمرير */
}
</style>

<style>
/* --- إضافات التوافق مع النقال (Responsive Design) --- */
@media (max-width: 768px) {
    body {
        padding: 10px; /* تقليل المسافات الجانبية في النقال */
    }

    /* ضبط الشعار ليناسب الشاشات الصغيرة */
    .halo-logo-hero {
        height: 300px; /* تقليل ارتفاع الخلفية */
    }
    .moving-logo-float {
        width: 120px; /* تصغير الشعار المتحرك */
    }

    /* تحويل الهيدر لنظام عمودي */
    .header-main {
        flex-direction: column;
        padding: 20px;
        gap: 15px;
    }

    .system-date {
        position: static; /* إلغاء التمركز المطلق ليظهر تحت العنوان */
        transform: none;
        text-align: center;
        margin-top: 10px;
    }

    /* جعل التبويبات (التابات) قابلة للتمرير عرضياً */
    .tabs-container {
        overflow-x: auto;
        white-space: nowrap;
        padding-bottom: 5px;
    }
    .tab-link {
        padding: 10px 15px;
        font-size: 0.9rem;
    }

    /* تحويل الجدول إلى "كروت" (Cards) لسهولة القراءة */
    table, thead, tbody, th, td, tr { 
        display: block; 
        width: 100%;
    }
    
    thead { display: none; } /* إخفاء رؤوس الجدول في النقال */
    
    tr {
        margin-bottom: 20px;
        border: 1px solid rgb(255, 128, 0);
        border-radius: 15px;
        background: #fff;
        overflow: hidden;
    }

    td {
        text-align: right;
        padding: 12px 15px;
        position: relative;
        padding-right: 45%; /* مساحة لاسم العمود */
        border: none !important;
        border-bottom: 1px solid #eee !important;
    }

    /* إضافة اسم العمود قبل كل قيمة */
    td:before {
        position: absolute;
        right: 15px;
        width: 40%;
        font-weight: 700;
        color: var(--primary);
        content: attr(data-label); /* سيحتاج إضافة بسيطة في HTML أو نكتبها يدوياً */
        text-align: right;
    }

    /* تعديل العمليات لتظهر بجانب بعضها */
    td:last-child {
        border-bottom: none !important;
        background: #fdfdfd;
    }
    
    .workspace {
        padding: 15px;
    }

    .search-box {
        flex-direction: column;
    }

    .back-fab {
        width: 50px;
        height: 50px;
        bottom: 20px;
        left: 20px;
    }
}
</style>
</head>

<!-- 4. السكريبت المسؤول عن الثبات (ضعه قبل نهاية وسم body) -->
<script>
function loadData(status, keyword, page) {
    const container = document.getElementById('content-to-refresh');
    if (container) container.style.opacity = '0.4';

    const url = `/shipments?status=${status}&keyword=${encodeURIComponent(keyword || '')}&page=${page}`;

    fetch(url)
        .then(response => response.text())
        .then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const newContent = doc.getElementById('content-to-refresh');
            
            if (newContent) {
                // 1. تحديث الجدول
                container.innerHTML = newContent.innerHTML;
                container.style.opacity = '1';
                
                // 2. تحديث الحقل المخفي ليكون البحث متوافق مع التبويب الجديد
                document.getElementById('currentStatusField').value = status;
                
                // 3. تحديث الشكل المرئي للتبويبات
                document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
                const activeTab = document.getElementById('tab-' + status);
                if (activeTab) activeTab.classList.add('active');

                // 4. تحديث رابط المتصفح
                window.history.pushState({status, keyword, page}, '', url);
            }
        })
        .catch(err => {
            console.error(err);
            window.location.href = url; // Fail-safe
        });
}
</script>

    <script>
        function smartBack() { window.location.href = '/'; }

function showReason(reason) {
    // هذا السطر يضمن الحصول على الرابط الرئيسي للموقع (مثلاً: http://localhost:8080 أو رابط ريندر)
    const baseUrl = window.location.origin;
    const imageUrl = baseUrl + '/images/ty.png';

    Swal.fire({
        title: '',
        html: `
            <div style="
                background-image: url('${imageUrl}'); 
                background-size: 100% 100%; 
                background-repeat: no-repeat;
                width: 100%; 
                height: 550px; 
                display: flex; 
                align-items: center; 
                justify-content: center; 
                box-sizing: border-box;
                padding: 100px 80px; 
                border: 1px solid rgba(0, 0, 0, 0.1);
                border-radius: 15px;
            ">
                <div style="
                    color: #1e293b;
                    font-family: 'Cairo', sans-serif;
                    text-align: center;
                    word-wrap: break-word;
                    overflow-y: auto; 
                    max-height: 100%;
                    width: 100%;
                ">
                    <h3 style="margin-bottom: 10px; font-size: 1rem; color: #1e293b; font-weight: 900;">
                        سبب الرفض المسجل
                    </h3>
                    <p style="
                        font-weight: 700; 
                        font-size: 1.1rem; 
                        line-height: 1.6; 
                        margin: 0;
                        color: #0f172a;
                    ">
                        ${reason ? reason : 'لم يتم تحديد سبب'}
                    </p>
                </div>
            </div>
        `,
        showConfirmButton: true,
        confirmButtonColor: '#fb7185',
        confirmButtonText: 'إغلاق',
        width: '600px',
        padding: '0',
        background: 'transparent'
    });
}

       function fireConfirm(id, actionType) {
    if (actionType === 'approve') {
        // حالة الاعتماد
        Swal.fire({
            title: 'اعتماد الشحنة؟',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#059669',
            confirmButtonText: 'نعم، اعتماد',
            cancelButtonText: 'إلغاء'
        }).then((result) => { 
            if (result.isConfirmed) window.location.href = '/shipments/approve/' + id; 
        });
    } else if (actionType === 'reject') {
        // حالة الرفض مع حماية من النصوص الطويلة
        Swal.fire({
            title: 'تأكيد رفض الشحنة',
            input: 'textarea',
            inputPlaceholder: 'يرجى كتابة سبب الرفض هنا (مثلاً: عدم مطابقة المواصفات)...',
            inputAttributes: {
                maxlength: 1000, // يمنع الكتابة فوق 1000 حرف تقنياً
                autocapitalize: 'off',
                autocorrect: 'off'
            },
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            confirmButtonText: 'حفظ الرفض',
            cancelButtonText: 'تراجع',
            footer: '<span id="char-count" style="color: #64748b; font-size: 0.8rem;"></span>',
            
            // هذا الجزء يمنع ظهور صفحة الخطأ 500
            preConfirm: (value) => {
                if (!value) {
                    Swal.showValidationMessage('عذراً، يجب إدخال سبب للرفض أولاً');
                } else if (value.length > 1000) {
                    Swal.showValidationMessage('النص طويل جداً! يرجى الاختصار لضمان التنسيق (أقل من 1000 حرف)');
                }
                return value;
            }
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                // إنشاء النموذج وإرساله فقط إذا كان النص سليماً
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/shipments/reject/' + id;
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'reason';
                input.value = result.value;
                
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        });
    }
}

        function fireDelete(id) {
            Swal.fire({ title: 'حذف السجل؟', icon: 'error', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'حذف' })
            .then((result) => { if (result.isConfirmed) window.location.href = '/shipments/delete/' + id; });
        }
    </script>
</body>
