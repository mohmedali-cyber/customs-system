<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">إدارة الشحنات - منظومة الأرشيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: rgb(48, 48, 48);
            --primary2: rgb(255, 255, 255);
            --primary3: rgb(0, 0, 0);

            --accent: rgb(0, 0, 0);
            --accent-glow: rgba(37, 99, 235, 0.15);
            --bg-body: rgb(255, 255, 255);
            --text-main: rgb(255, 169, 83);
            --text-muted: rgb(0, 255, 64);
            --text-muted4: rgb(255, 255, 255);
            --white: rgb(192, 192, 192);
            --success: #059669;      
            --success1: rgb(255, 255, 255);
            --success6: rgb(170, 85, 0);

            --danger: #dc2626;
            --shadow-md: 0 10px 25px -5px rgb(255, 197, 138);
            --radius: 16px;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(at 0% 0%, rgb(0, 0, 0) 0px, transparent 50%), 
                              radial-gradient(at 100% 100%, rgb(0, 0, 0) 0px, transparent 50%);
            margin: 0; padding: 40px; color: var(--text-main);
            min-height: 100vh;
        }

        .back-fab {
            position: fixed; bottom: 40px; left: 40px;
            background: var(--white); color: var(--primary);
            width: 60px; height: 60px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-md); transition: 0.4s;
            z-index: 1000; border: 1px solid rgba(255,255,255,0.8); cursor: pointer;
        }
        .back-fab:hover { transform: translateY(-5px); background: var(--primary); color: white; }

        .header-main { 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; background: rgb(45, 45, 45);
            backdrop-filter: blur(10px); padding: 25px 40px;
            border-radius: var(--radius); box-shadow: var(--shadow-md);
            border: 1px solid rgb(255, 128, 0);
        }

        .header-info { display: flex; align-items: center; gap: 25px; }
        .portal-btn {
            background: var(--primary); color: rgb(255, 168, 81); text-decoration: none;
            padding: 1px 25px; border-radius: 12px; font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.3s;
        }
        .portal-btn:hover { background: var(--accent); }

.tabs-container { 
    display: flex; 
    gap: 15px; /* زدنا المسافة بين الأزرار قليلاً */
    margin-bottom: -1px; 
    padding: 0 20px; 
    align-items: flex-end; /* لضمان محاذاة الأزرار من الأسفل */
}

.tab-link {
    /* تكبير الحشوة الداخلية (الطول والعرض) */
    padding: 20px 55px; 
    background: rgb(75, 75, 75);
    border-radius: 20px 18px 0 0;
    color: var(--success1);
    
    /* تكبير حجم الخط بشكل ملحوظ */
    font-size: 1.5rem; 
    /* ملاحظة: أقصى قيمة عملية لـ font-weight هي 900 */
    font-weight: 900; 
    
    transition: 0.3s;
    border: none;
    cursor: pointer;
    position: relative;
    
    /* لضمان تنسيق الأيقونات مع النص */
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

/* 🔥 التاب النشط */
/* ✨ أنميشن وميض النص الداخلي للأزرار */
@keyframes tabTextGlow {
    0%, 100% {
        text-shadow: 0 0 4px currentColor;
        transform: translateY(0) scale(1);
    }
    50% {
        text-shadow: 0 0 12px currentColor, 0 0 20px currentColor;
        transform: translateY(-2px) scale(1.02); /* رفعة خفيفة مع نبضة حية للزر */
    }
}

/* 🟠 وميض زر "قيد المراجعة" لما يكون هو النشط */
.tab-link.active[onclick*="PENDING"] {
    color: rgb(255, 140, 0) !important; /* النص يتحول للبرتقالي الملكي */
    background: rgb(50, 50, 50) !important; /* خلفية داكنة تبرز اللون */
    border-bottom: 3px solid rgb(255, 140, 0) !important; /* خط سفلي برتقالي */
    animation: tabTextGlow 4s infinite ease-in-out;
}

/* 🟢 وميض زر "معتمدة" لما يكون هو النشط */
.tab-link.active[onclick*="APPROVED"] {
    color: #10b981 !important; /* النص يتحول للأخضر الزاهي النظيف */
    background: rgb(50, 50, 50) !important;
    border-bottom: 3px solid #10b981 !important; /* خط سفلي أخضر */
    animation: tabTextGlow 4s infinite ease-in-out;
}

/* 🔴 وميض زر "مرفوضة" لما يكون هو النشط */
.tab-link.active[onclick*="REJECTED"] {
    color: #ef4444 !important; /* النص يتحول للأحمر التنبيهي الفاقع */
    background: rgb(50, 50, 50) !important;
    border-bottom: 3px solid #ef4444 !important; /* خط سفلي أحمر */
    animation: tabTextGlow 2.5s infinite ease-in-out; /* أنميشن أسرع قليلاً */
}

        .workspace {
            background: var(--white); border-radius: var(--radius);
            padding: 40px; box-shadow: var(--shadow-md);
            border: 1px solid rgb(255, 128, 0); min-height: 500px;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 15px; }
        th { padding: 15px 20px; color: var(--text-muted); font-size: 0.9rem; text-align: center; }
        td { padding: 20px; text-align: center; background: rgb(255, 255, 255); border-top: 1px solid rgb(0, 0, 0); border-bottom: 1px solid rgb(0, 0, 0); }
        tr td:first-child { border-right: 1px solid rgb(221, 111, 0); border-radius: 0 18px 18px 0; }
        tr td:last-child { border-left: 1px solid rgb(210, 105, 0); border-radius: 18px 0 0 18px; }

        .stat-badge { background: linear-gradient(135deg, var(--primary), var(--accent)); color: rgb(255, 159, 64); padding: 6px 16px; border-radius: 8px; font-weight: 700; }

        /* زر عرض السبب الجديد */
        .btn-reason {
            background: rgb(40, 40, 40); color: var(--danger); border: 1px solid rgb(0, 0, 255);
            padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            font-weight: 700; transition: 0.3s; margin-top: 5px;
        }
        .btn-reason:hover { background: var(--danger); color: rgb(255, 128, 192); }

        .btn-mini { padding: 10px 20px; border-radius: 10px; border: none; font-family: 'Cairo'; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-view { background: var(--accent-glow); color: var(--accent); }
        .btn-approve { background: rgba(5, 150, 105, 0.1); color: var(--success); }
        .btn-reject { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        .btn-delete { background: rgb(136, 0, 0); color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; border: none; cursor: pointer; }

        .pagination-container { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #f8fafc; padding-top: 20px; }
        .pagination-list { display: flex; gap: 8px; list-style: none; }
        .page-item-link { text-decoration: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 10px; font-weight: 700; color: var(--primary); }
        .page-item-link.active { background: var(--primary); color: white; }
   
   
   
   
   
   
   
   
   
   
.luxury-logo-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    /* أزلنا الـ perspective لأنه غير ضروري لحركة الطفو ويقلل حمل الرندر */
}

.halo-logo-hero {
    width: 100%;
    height: 500px; /* الطول المعتمد */
    object-fit: cover;
    filter: brightness(0.7);
    border-radius: 0 0 20px 20px;
}

/* طبقة الشعار المتحرك - وضعية علوية مركّزة */
.floating-overlay {
    position: absolute; 
    top: 50%; /* الارتفاع المطلوب للأعلى */
    left: 50%;
    transform: translate(-50%, -50%); 
    z-index: 10;
}

.moving-logo-float {
    width: 170px; 
    height: auto;
    /* استدعاء الأنميشن الجديد المدمج */
    animation: flutter-float 41s infinite ease-in-out;
    /* دمج ظلال قوية وواضحة لتعزيز الفخامة */
    filter: drop-shadow(0 15px 35px rgba(255, 168, 81, 0.6));

    animation: soft-float 21s infinite ease-in-out;


    will-change: transform; 
}

/* أنميشن الطفو الانسيابي (أخف وأجمل) */
@keyframes soft-float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
        filter: drop-shadow(0 15px 25px rgb(0, 0, 0));
    }
    50% {
        /* حركة للأعلى بمقدار 20 بكسل مع ميلان بسيط جداً */
        transform: translateY(-20px) rotate(1deg);
        /* الظل يصبح أنعم عند الارتفاع */
        filter: drop-shadow(0 20px 40px rgb(255, 153, 51));
    }
}
/* الأنميشن المدمج: طفو + رفرفة خفيفة */
@keyframes flutter-float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        /* ميلان خفيف لليسار أثناء الصعود */
        transform: translateY(-1px) rotate(4deg);
    }
    50% {
        /* أقصى ارتفاع مع ميلان لليمين */
        transform: translateY(-20px) rotate(40.5deg);
    }
    75% {
        /* بداية النزول مع ميلان عكسي */
        transform: translateY(-10px) rotate(-0.15deg);
    }
}


    </style>


<style>

.custom-thead {
    /* تدرج ذهبي ملكي داكن */
    background: linear-gradient(135deg, rgba(218, 165, 32, 0.9) 0%, rgba(184, 134, 11, 1) 100%);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* ظل خفيف لفصل الرأس */
}

.custom-thead th {
    color: #ffffff; /* لون النص أبيض ناصع لوضوح القراءة */
    font-weight: 700; /* خط سميك */
    font-size: 1.1rem; /* حجم خط أكبر قليلاً */
    text-shadow: 0 1px 3px rgba(0,0,0,0.3); /* ظل خفيف خلف النص */
    padding: 15px 10px; /* مسافة داخلية مريحة */
    border-bottom: 2px solid #ffffff; /* خط سفلي رفيع للأناقة */
    white-space: nowrap; /* منع انقسام النص */
}

/* التنسيق الأساسي للحاوية الكبرى للهيدر */
.header-main {
    display: flex;
    flex-direction: column; /* يجعل العناصر تترتب تحت بعضها رأساً */
    align-items: center;    /* يضمن توسيط الشعار والعنوان في المنتصف تماماً */
    justify-content: center;
    position: relative;     /* أساسي لتثبيت موقع التاريخ في الجانب */
    padding: 30px 40px;
    background: rgb(40, 40, 40); /* متناسق مع كود الألوان الحالي لديك */
    border-radius: 16px;
    border: 1px solid rgb(255, 128, 0);
    box-shadow: 0 0 25px rgba(255, 128, 0, 0.2);
    gap: 7px;             /* مسافة متناسقة لكي لا يلتصق الشعار بالكلام */
}

/* حاوية الشعار */
.logo-container {
    margin-bottom: 2px;    /* مسافة إضافية بسيطة تفصل الشعار عن العنوان بالأسفل */
    display: flex;
    justify-content: center;
}

/* حاوية العنوان والأزرار */
.header-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
}

/* سحب تاريخ النظام إلى أقصى اليمين أو اليسار بناءً على رغبتك باستخدام Absolute */
.system-date {
    position: absolute;
    right: 40px;        /* يحدد المسافة من اليمين */
    left: auto;         /* إلغاء أي قيمة قديمة لليسار */
   top: 80%; 
    transform: translateY(-50%);
    text-align: center;
}

/* في حال تداخل التاريخ مع التصميم على الشاشات الصغيرة */
@media (max-width: 768px) {
    .header-main {
        padding-bottom: 80px;
    }
    .system-date {
        position: static;
        transform: none;
        margin-top: 15px;
    }
}

/* إذا أردت التاريخ في جهة اليسار بدلاً من اليمين، استبدل right بـ left: 30px */

.date-label {
    font-size: 0.85rem;
    color: var(--text-muted);
}

.date-value {
    font-size: 1rem;
    color: var(--primary2);
    font-weight: 700;
}
.portal-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    /* يمكنك إضافة الوانك الملكية هنا */
    background: linear-gradient(135deg, rgb(255, 143, 32) 0%, rgb(31, 31, 31) 100%);
    color: rgb(255, 255, 255);
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.3s ease;
}

.portal-btn:hover {
    transform: translateY(-3px); /* رفعة بسيطة عند التمرير */
}




/* 🟠 ألوان قيد المراجعة (الافتراضية) */
.workspace.status-pending {
    border: 1px solid rgb(255, 128, 0);
}

/* 🟢 ألوان المعتمدة (تغيير فخم وهادي) */
.workspace.status-approved {
    border: 1px solid #059669;
}


/* 🔴 ألوان المرفوضة (تنبيه ذكي) */
.workspace.status-rejected {
    border: 1px solid #dc2626;
}
.workspace.status-rejected .custom-thead {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
}




</style>
</head>
<body>



<button onclick="smartBack()" class="back-fab" title="الرجوع للرئيسية">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
</button>



<div class="header-main">
    
    <div class="logo-container">
        <div class="luxury-logo">
            <img th:src="@{/images/dr.png}" class="halo-logo" style="width: 130px; height: auto;" />
        </div>
    </div> 

    <div class="header-info">
        <h2 th:text="${pageTitle}">إدارة الشحنات الذكية</h2>
        <a th:href="@{/}" class="portal-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            البوابة الرئيسية
        </a>
   
    </div>

    <div class="system-date">
        <div class="date-label">تاريخ النظام</div>
        <div class="date-value" th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">2026-05-22</div>
    </div>
</div>
<div class="tabs-container">
<button class="tab-link"
        th:classappend="${currentStatus == 'PENDING'} ? 'active' : ''"
        onclick="loadTab('PENDING', this)">
     قيد المراجعة
</button>

<button class="tab-link"
        th:classappend="${currentStatus == 'APPROVED'} ? 'active' : ''"
        onclick="loadTab('APPROVED', this)">
    ✅ معتمدة
</button>

<button class="tab-link"
        th:classappend="${currentStatus == 'REJECTED'} ? 'active' : ''"
        onclick="loadTab('REJECTED', this)">
    ❌ مرفوضة
</button>
</div>


<div class="workspace" th:classappend="${currentStatus == 'APPROVED' ? 'status-approved' : (currentStatus == 'REJECTED' ? 'status-rejected' : 'status-pending')}">
 <form th:action="@{/shipments}" method="get" class="search-box"
      style="display: flex; gap: 10px; margin-bottom: 30px; background: rgb(212, 212, 212); padding: 8px; border-radius: 15px; align-items: center;">
    
    <input type="hidden" name="status" th:value="${currentStatus}"> 
   
    <div style="position: relative; flex: 1; display: flex; align-items: center;">
        
        <input type="text" id="search-input" name="keyword" th:value="${keyword}" 
               style="width: 100%; border: 1px solid rgb(179, 89, 0); background: rgba(255, 255, 255, 0.1); 
                      backdrop-filter: blur(10px); padding: 12px 40px 12px 20px; border-radius: 12px; 
                      color: var(--primary3); font-family: 'Cairo'; outline: none; transition: 0.3s;" 
               placeholder="🔍 ابحث برقم الحاوية أو المخلص..." 
               oninput="toggleClearButton()">
        
        <span id="clear-search" onclick="clearSearchField()" 
              style="position: absolute; left: 15px; cursor: pointer; color: #dc2626; font-weight: bold; font-size: 1.2rem; display: none; user-select: none; transition: 0.2s;"
              onmouseover="this.style.transform='scale(1.2)'"
              onmouseout="this.style.transform='scale(1)'">
            ✖
        </span>
    </div>
   
    <button type="submit" style="background: var(--primary); color: rgb(255, 128, 0); border: none; padding: 10px 30px; border-radius: 12px; cursor: pointer; font-weight: 700;">بحث</button>
</form>

    <!-- 🔥 الجزء اللي بيتحدث فقط -->
<div id="table-container" th:fragment="tableFragment">
    <div th:if="${not #lists.isEmpty(shipments)}">
        <table>
            <thead class="custom-thead">
                <tr>
                    <th>رقم الحاوية</th>
                    <th>المخلص الجمركي</th>
                    <th>الرمز الإحصائي</th>
                    <th>الحالة</th>
                    <th>العمليات</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="s : ${shipments}">
                    <td><strong th:text="${s.containerNumber}" style="color: var(--primary3); font-size: 1.1rem;"></strong></td>
                    <td th:text="${s.customsbroker}" style="color: var(--primary3); font-size: 1.1rem;"></td>
                    <td><span class="stat-badge" th:text="${s.statisticalCode}"></span></td>

                    <td>
                        <div th:if="${s.status.name() == 'REJECTED'}">
                            <span style="color: var(--danger); font-weight: 700;">❌ مرفوضة</span><br>
                            <button class="btn-reason" th:onclick="showReason([[${s.rejectionReason}]])">🔎 عرض السبب</button>
                        </div>

                        <span th:if="${s.status.name() == 'APPROVED'}" style="color: var(--success6); font-weight: 700;">✅ معتمدة</span>
                        <span th:if="${s.status.name() == 'PENDING'}" style="color: var(--primary3); font-weight: 700;">⏳ قيد المراجعة</span>
                    </td>

                    <td>
                        <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                            <a th:href="@{'/shipments/view-docs/' + ${s.id}}" class="btn-mini btn-view">عرض</a>

                            <button sec:authorize="hasRole('ADMIN')" 
                                    class="btn-delete" 
                                    th:onclick="'fireDelete(' + ${s.id} + ')'">
                                🗑️
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
            <div class="pagination-container" th:if="${totalPages > 1}">
                <div class="page-info">
                    صفحة <span th:text="${currentPage + 1}"></span> من 
                    <span th:text="${totalPages}"></span>
                </div>

                <ul class="pagination-list" style="margin:0; padding:0;">
                    <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" style="list-style:none;">
                        <a th:href="@{/shipments(status=${currentStatus}, keyword=${keyword}, page=${i})}" 
                           th:text="${i + 1}" 
                           class="page-item-link"
                           th:classappend="${i == currentPage} ? 'active' : ''">
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(shipments)}" style="text-align: center; padding: 100px 0;">
            <h3 style="color: var(--text-muted2);">لا توجد سجلات حالياً</h3>
        </div>

    </div>

</div>
    <script>
        function smartBack() { window.location.href = '/'; }

function showReason(reason) {
    Swal.fire({
        title: '',
        html: `
            <div style="
                background-image: url('/images/ty.png'); 
                background-size: 100% 100%; 
                background-repeat: no-repeat;
                width: 100%; 
                height: 550px; /* زدنا الطول الكلي */
                display: flex; 
                align-items: center; 
                justify-content: center; 
                box-sizing: border-box;
                /* تعديل الـ padding لحصر النص في المربع الشفاف بالضبط */
                padding: 100px 80px; 
                border: 1px solid rgba(0, 0, 0, 0.1);
                border-radius: 15px;
            ">
                <div style="
                    color: #1e293b;
                    font-family: 'Cairo', sans-serif;
                    text-align: center;
                    word-wrap: break-word;
                    overflow-y: auto; /* لو النص زاد جداً يسمح بالتمرير داخل المربع */
                    max-height: 100%;
                    width: 100%;
                ">
                    <h3 style="margin-bottom: 10px; font-size: 1rem; color: #1e293b; font-weight: 900;">
                        سبب الرفض المسجل
                    </h3>
                    <p style="
                        font-weight: 700; 
                        font-size: 1.1rem; /* تصغير الخط درجة واحدة ليتسع للنصوص الطويلة */
                        line-height: 1.6; 
                        margin: 0;
                        color: #0f172a;
                    ">
                        ${reason ? reason : 'لم يتم تحديد سبب'}
                    </p>
                </div>
            </div>
        `,
        showConfirmButton: true,
        confirmButtonColor: '#fb7185',
        confirmButtonText: 'إغلاق',
        width: '600px', /* تكبير عرض النافذة الكلي */
        padding: '0',
        background: 'transparent'
    });
}

       function fireConfirm(id, actionType) {
    if (actionType === 'approve') {
        // حالة الاعتماد
        Swal.fire({
            title: 'اعتماد الشحنة؟',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#059669',
            confirmButtonText: 'نعم، اعتماد',
            cancelButtonText: 'إلغاء'
        }).then((result) => { 
            if (result.isConfirmed) window.location.href = '/shipments/approve/' + id; 
        });
    } else if (actionType === 'reject') {
        // حالة الرفض مع حماية من النصوص الطويلة
        Swal.fire({
            title: 'تأكيد رفض الشحنة',
            input: 'textarea',
            inputPlaceholder: 'يرجى كتابة سبب الرفض هنا (مثلاً: عدم مطابقة المواصفات)...',
            inputAttributes: {
                maxlength: 1000, // يمنع الكتابة فوق 1000 حرف تقنياً
                autocapitalize: 'off',
                autocorrect: 'off'
            },
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            confirmButtonText: 'حفظ الرفض',
            cancelButtonText: 'تراجع',
            footer: '<span id="char-count" style="color: #64748b; font-size: 0.8rem;"></span>',
            
            // هذا الجزء يمنع ظهور صفحة الخطأ 500
            preConfirm: (value) => {
                if (!value) {
                    Swal.showValidationMessage('عذراً، يجب إدخال سبب للرفض أولاً');
                } else if (value.length > 1000) {
                    Swal.showValidationMessage('النص طويل جداً! يرجى الاختصار لضمان التنسيق (أقل من 1000 حرف)');
                }
                return value;
            }
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                // إنشاء النموذج وإرساله فقط إذا كان النص سليماً
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/shipments/reject/' + id;
                
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'reason';
                input.value = result.value;
                
                form.appendChild(input);
                document.body.appendChild(form);
                form.submit();
            }
        });
    }
}

        function fireDelete(id) {
            Swal.fire({ title: 'حذف السجل؟', icon: 'error', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'حذف' })
            .then((result) => { if (result.isConfirmed) window.location.href = '/shipments/delete/' + id; });
        }

<script>
// 1. دالة الـ التابات الذكية (تحتفظ بالبحث عند التنقل لو موجود)
async function loadTab(status, el) {
    // 1. نتحققوا هل التاب اللي نقرنا عليها توا هي أصلاً نشطة (Active)؟
    const isAlreadyActive = el.classList.contains('active');

    // 2. لو كانت نشطة ونقرنا عليها مرة ثانية، يعني المستخدِم يبي يسكرها
    if (isAlreadyActive) {
        el.classList.remove('active'); // نحّي حالة النشاط من الزر
        
        // فضّي الحاوية فوراً عشان تختفي القائمة والجدول
document.querySelector('#table-container').innerHTML = `
    <div style="text-align: center; padding: 10px 10px 40px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Cairo', sans-serif;">
        
        <style>
            @keyframes smoothZoom {
                0% { transform: scale(1); }
                50% { transform: scale(1.04); }
                100% { transform: scale(1); }
            }
            .animated-ultra-banner {
                animation: smoothZoom 8s infinite ease-in-out;
                transition: transform 0.5s ease;
            }
        </style>

        <div style="width: 100%; max-width: 1100px; height: auto; aspect-ratio: 16 / 7; min-height: 220px; max-height: 420px; margin: 20px auto; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.25);">
            
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('/images/pv.png'); background-size: cover; background-position: center; filter: blur(20px) brightness(0.6); transform: scale(1.1); z-index: 1;"></div>
            
            <div style="position: relative; width: 100%; height: 100%; z-index: 2; display: flex; align-items: center; justify-content: center;">
                <img src="/images/pv.png" class="animated-ultra-banner" alt="منظر الميناء والشعار كامل الأطراف" 
                     style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; pointer-events: none;" />
            </div>
                 
        </div>
       
    </div>
`;     
        // نلغوا قيمة الـ Hidden input عشان نمنعوا أي تداخل
        const hiddenStatusInput = document.querySelector('input[name="status"]');
        if (hiddenStatusInput) hiddenStatusInput.value = '';
        return; // نوقفوا التنفيذ هنا وما نطلبوش بيانات من السيرفر
    }

    // 3. لو مكانتش نشطة (يعني أول نقرة عشان يفتح القائمة)، نفذ المنطق الطبيعي بتاع الجلب
    document.querySelectorAll('.tab-link').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');

    try {
        const searchInput = document.getElementById('search-input');
        const keyword = searchInput ? searchInput.value : '';

        // نطلبوا البيانات من السيرفر للتاب المحددة
        const res = await fetch(`/shipments/fragment?status=${status}&keyword=${encodeURIComponent(keyword)}`);
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        document.querySelector('#table-container').innerHTML = doc.querySelector('#table-container').innerHTML;

        const hiddenStatusInput = document.querySelector('input[name="status"]');
        if (hiddenStatusInput) hiddenStatusInput.value = status;

    } catch (e) {
        console.error("خطأ أثناء جلب البيانات:", e);
    }
}

// 2. دالة تظهّر وتخفي زر الـ X حسب لو الخانة فيها كتيبة أو لا
function toggleClearButton() {
    const input = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search');
    if (input && clearBtn) {
        clearBtn.style.display = input.value.trim().length > 0 ? 'block' : 'none';
    }
}

// 3. دالة تفريغ البحث الاحترافية (لما تضغط على X)
async function clearSearchField() {
    const input = document.getElementById('search-input');
    if (input) {
        input.value = ''; // مسح النص
        toggleClearButton(); // إخفاء زر X
        
        // جلب الحالة الحالية المفتوحة عشان نرد الجدول الأصلي بتاعها
        const hiddenStatusInput = document.querySelector('input[name="status"]');
        const status = hiddenStatusInput ? hiddenStatusInput.value : 'PENDING';
        
        // تحديث الجدول فوراً بدون ريفريش كامل للصفحة
        try {
            const res = await fetch(`/shipments/fragment?status=${status}&keyword=`);
            const html = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            document.querySelector('#table-container').innerHTML = doc.querySelector('#table-container').innerHTML;
        } catch (e) {
            console.error(e);
        }
    }
}

// تشغيل الفحص أول ما تفتح الصفحة لو كان فيه بحث سابق معلق
document.addEventListener("DOMContentLoaded", function() {
    toggleClearButton();
});
function reBindActions() {

    // بس هنستخدمها لو حبينا نربط events لاحقاً
}
function resetTabs() {
    document.querySelectorAll('.tab-link').forEach(btn => {
        btn.classList.remove('active');
    });
}
</script>
