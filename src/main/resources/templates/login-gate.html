<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصلحة الجمارك - نظام المشغل الاقتصادي</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* ======== إعداد الجسم (الخلفية المتدرجة المتحركة) ======== */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, rgb(64, 128, 128), rgb(255, 255, 255), rgb(0, 0, 0), rgb(0, 0, 0), rgb(0, 0, 0));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            direction: rtl;
        }

        @keyframes gradientBG {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* ======== الحاوية الرئيسية ======== */
        .login-container {
            text-align: center;
            width: 90%;
            max-width: 350px;
            padding: 20px;
        }

        /* ======== الشعار الرئيسي الذهبي التفاعلي ======== */
        .main-logo {
            width: 280px;
            max-width: 90%;
            height: auto;
            margin-bottom: 20px;
            cursor: pointer; 
            transition: transform 0.3s ease, filter 0.3s ease; 
            /* الفلتر الذهبي الخاص بك */
            filter: brightness(0) saturate(100%) invert(76%) sepia(38%) saturate(600%) hue-rotate(5deg);
        }

        .main-logo:hover {
            transform: scale(1.05);
            filter: brightness(0) saturate(100%) invert(76%) sepia(38%) saturate(600%) hue-rotate(5deg) drop-shadow(0 12px 25px rgba(0,0,0,0.35));
        }
        .main-logo:active { transform: scale(0.9); }

        /* ======== فورم الجمارك الداكن المطور ======== */
        form {
            background: rgba(27, 27, 27, 0.85);
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4), 0 0 18px rgba(212, 175, 55, 0.6);
            box-sizing: border-box;
            transition: box-shadow 0.5s ease;
        }
        form:hover {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 35px rgba(212, 175, 55, 0.6);
        }

        /* الشعار الداخلي للفورم */
        .inner-form-logo {
            width: 90px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
            filter: none !important;
        }
        .inner-form-logo:hover {
            transform: scale(1.1);
        }

        /* تنسيق الحقول الجمركية بالكامل */
        .input-wrapper {
            width: 100%;
            margin-bottom: 15px;
            text-align: right;
        }

        .input-wrapper label {
            display: block;
            font-size: 13px;
            color: #d4af37; /* لون ذهبي ناعم متناسق مع التوهج */
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-wrapper .required {
            color: rgb(0, 128, 0);
        }

        input {
            display: block;
            padding: 11px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            outline: none;
            text-align: center;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            font-size: 15px;
            font-weight: 600;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
            background: #ffffff;
        }

        /* زر الدخول الذهبي */
        .btn-submit-gate {
            width: 100%;
            background: linear-gradient(145deg, #d4af37, #b8860b);
            border: none;
            padding: 11px 25px;
            border-radius: 8px;
            color: black; 
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s, box-shadow 0.5s ease;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }

        .btn-submit-gate:hover {
            background: rgb(0, 0, 0);
            color: white;
            box-shadow: 0 0 15px rgb(212,175,55,0.4);
        }

        .btn-submit-gate:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* روابط التنقل السفلي */
        .link {
            display: block;
            margin-top: 18px;
            color: rgb(255, 164, 72);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .link:hover {
            text-decoration: underline;
        }

        /* رسائل الحالة والتنبيهات للجمارك */
        .gate-msg {
            font-size: 13px;
            margin-top: 10px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 600;
        }
        .gate-msg.info { color: #00bcd4; }
        .gate-msg.danger { color: #ff6961; }

        /* ستايل النجوم الذهبية التفاعلية عند النقير */
        .star {
            position: fixed;
            color: #D4AF37; 
            font-size: 1.8rem;
            pointer-events: none;
            z-index: 9999;
            animation: star-animation 0.9s ease-out forwards;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.9);
        }

        @keyframes star-animation {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.3) rotate(var(--r)); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="login-container">
    
    <img th:src="@{/images/im.png}" alt="شعار" class="main-logo" id="mainLogo" onclick="magicDust(event)">

    <form id="gateLoginForm" onsubmit="handleGateLogin(event)">
        
        <img src="/images/cos2.png" alt="شعار صغير" class="inner-form-logo">
        
        <div class="input-wrapper">
            <label for="regId">رقم التسجيل: <span class="required">*</span></label>
            <input type="text" id="regId" name="loginId" placeholder="أدخل رقم التسجيل" required autocomplete="off">
        </div>

        <div class="input-wrapper">
            <label for="verifyCode">رمز التحقق: <span class="required">*</span></label>
            <input type="password" id="verifyCode" name="vCode" placeholder="أدخل رمز التحقق" required autocomplete="off">
        </div>

        <div id="gateMessage" class="gate-msg"></div>

        <button type="submit" id="submitLoginBtn" class="btn-submit-gate">دخول</button>
        
        <a href="/shipments/new" class="link">تسجيل جديد</a>
    </form>
</div>

<script>
function handleGateLogin(e) {
    e.preventDefault();
    
    const loginId = document.getElementById('regId').value.trim();
    const vCode = document.getElementById('verifyCode').value.trim();
    const msg = document.getElementById('gateMessage');
    const btn = document.getElementById('submitLoginBtn');

    msg.textContent = "⏳ جاري التحقق من مفاتيح الأمان...";
    msg.className = "gate-msg info";
    btn.disabled = true;

    const params = new URLSearchParams();
    params.append('loginId', loginId);
    params.append('vCode', vCode);

    fetch('/shipments/track-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
    })
    .then(async res => {
        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(errorText);
        }
        window.location.href = `/shipments/edit-list?loginId=${loginId}&vCode=${vCode}`;
    })
    .catch(err => {
        btn.disabled = false;
        msg.textContent = err.message || "❌ فشل الاتصال بالسيرفر الجمركي.";
        msg.className = "gate-msg danger";
    });
}

// دالة تأثير تفجير النجوم السحرية عند الضغط على الشعار (تأثير كودك تماماً)
let clickCount = 0;
let isCoolingDown = false;

function magicDust(e) {
    if (isCoolingDown) return;

    clickCount++;

    for (let i = 0; i < 22; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.innerHTML = '✦'; 
        
        star.style.left = e.clientX + 'px';
        star.style.top = e.clientY + 'px';
        
        const destinationX = (Math.random() - 0.5) * 600; 
        const destinationY = (Math.random() - 0.5) * 400;
        const rotation = Math.random() * 360;
        const delay = Math.random() * 0.1;

        star.style.setProperty('--x', `${destinationX}px`);
        star.style.setProperty('--y', `${destinationY}px`);
        star.style.setProperty('--r', `${rotation}deg`);
        star.style.animationDelay = `${delay}s`;

        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1000);
    }

    if (clickCount >= 15) {
        isCoolingDown = true;
        clickCount = 0;
        document.getElementById('mainLogo').style.opacity = "0.12";
        setTimeout(() => {
            isCoolingDown = false;
            document.getElementById('mainLogo').style.opacity = "1";
        }, 2000);
    }
}
</script>

</body>
</html>
