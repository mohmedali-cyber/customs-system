<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>دخول - منظومة الأرشيف الإلكتروني</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-bottom: 10px; font-size: 14px; }
        .logout { color: green; margin-bottom: 10px; font-size: 14px; }
        
        /* تنسيق رابط التسجيل الجديد */
        .register-link { margin-top: 20px; font-size: 14px; color: #666; }
        .register-link a { color: #007bff; text-decoration: none; font-weight: bold; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>تسجيل الدخول</h2>
    
    <!-- رسائل الخطأ والنجاح -->
    <div th:if="${param.error}" class="error">اسم المستخدم أو كلمة المرور خطأ!</div>
    <div th:if="${param.logout}" class="logout">تم تسجيل الخروج بنجاح.</div>
    <div th:if="${param.registered}" style="color: blue; margin-bottom: 10px; font-size: 14px;">تم إنشاء الحساب بنجاح، يمكنك الدخول الآن.</div>

    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="اسم المستخدم" required autofocus>
        <input type="password" name="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
    </form>

    <!-- الرابط الجديد -->
    <div class="register-link">
        ليس لديك حساب؟ 
        <a th:href="@{/register}">إنشاء حساب جديد</a>
    </div>
</div>

</body>
</html>
