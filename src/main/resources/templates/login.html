<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول - منظومة الأرشيف الإلكتروني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1e3a8a;
            --gold: rgb(0, 0, 160);
            --dark-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1e40af 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .login-container {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 15px rgba(255, 215, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنسيق الشعار الصغير فوق العنوان */
        .brand-logo {
            width: 100px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        h2 {
            color: var(--primary-blue);
            margin-bottom: 30px;
            font-weight: 700;
            border-bottom: 2px solid var(--gold);
            display: inline-block;
            padding-bottom: 5px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-align: right;
        }

        input:focus {
            border-color: var(--primary-blue);
            outline: none;
            box-shadow: 0 0 10px rgba(30, 58, 138, 0.1);
            background-color: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary-blue), #1e40af);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.3);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4);
            filter: brightness(1.1);
        }

        /* رسائل التنبيه */
        .msg { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .error { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .logout { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .success { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

        .register-link {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .register-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .register-link a:hover {
            color: var(--gold);
            text-decoration: underline;
        }

        /* توافق الشاشات الصغيرة (النقال) */
        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
                margin: 10px;
            }
            h2 { font-size: 20px; }
            button { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- يمكنك وضع شعار مصلحة الجمارك هنا -->
    <img th:src="@{/images/mi.png}" alt="Logo" class="brand-logo">
    
    <h2>تسجيل الدخول</h2>
    
    <div th:if="${param.error}" class="msg error">اسم المستخدم أو كلمة المرور خطأ!</div>
    <div th:if="${param.logout}" class="msg logout">تم تسجيل الخروج بنجاح.</div>
    <div th:if="${param.registered}" class="msg success">تم إنشاء الحساب، يمكنك الدخول الآن.</div>

    <form th:action="@{/login}" method="post">
        <div class="input-group">
            <input type="text" name="username" placeholder="اسم المستخدم" required autofocus>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="كلمة المرور" required>
        </div>
        <button type="submit">دخول للمنظومة</button>
    </form>

    <div class="register-link">
        ليس لديك حساب؟ 
        <a th:href="@{/register}">إنشاء حساب جديد</a>
    </div>
</div>

</body>
</html>
